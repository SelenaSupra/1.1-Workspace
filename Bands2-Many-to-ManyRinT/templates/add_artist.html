{% extends "base.html" %}
{% block title %}{{ super() }} - Add Band/Album Collaboration{% endblock %}
{% block content %}
<h2>Connect a Band to an Album</h2>
<p>Each submission creates one connection. Add another connection to attach another band to the same album.</p>
<form method="post" id="artistForm">
    <label for="bandid">Band:</label>
    <select id="bandid" name="bandid" required>
        <option value="">-- Select band --</option>
        {% for band in bands %}
        <option value="{{ band.BandID }}">{{ band.BandName }}</option>
        {% endfor %}
    </select><br>
    <label for="albumid">Album:</label>
    <select id="albumid" name="albumid" required>
        <option value="">-- Select album --</option>
        {% for album in albums %}
        <option value="{{ album.AlbumID }}" {% if selected_album_id == album.AlbumID %}selected{% endif %}>{{ album.AlbumTitle }}{% if album.ReleaseYear %} ({{ album.ReleaseYear }}){% endif %}</option>
        {% endfor %}
    </select><br>
    <button type="submit">Save Collaboration</button>
</form>
{% endblock %}
