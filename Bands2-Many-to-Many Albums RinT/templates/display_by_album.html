{% extends "base.html" %}
{% block title %} {{super()}} - {{album.AlbumTitle}} {% endblock %}
{% block content %}
<h2>Albums</h2>
{% for album in albums %}
<section>
    <h3>
        <a href="{{url_for('view_album', id=album.AlbumID)}}"
    </h3>
    {{ entity_buttons(entity_name="album", entity_id=album.AlbumID)}}
</section>



{% endblock %}
