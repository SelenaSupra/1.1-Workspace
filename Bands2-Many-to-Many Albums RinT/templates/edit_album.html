{% extends "base.html" %}
{% block title %} {{super()}} - Edit Album {% endblock %}
{% block content %}
<h2>Add Album</h2>
<form method="post" id="albumForm">
    <input type="hidden" name="album" value="{{album.AlbumID}}">
    <label>Title:</label><input type="text" name="albumtitle" value="{{album.AlbumTitle}}"><br>
    <label>Release Year:</label><input type="number" name="releaseyear" value="{{album.AlbumReleaseYear}}"><br>
    <button type="submit">Save</button>
</form>
{% endblock %}
